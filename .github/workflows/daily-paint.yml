name: Daily Paint

# Keeps the contribution graph active by running daily_paint.py and
# pushing the resulting commit to master.

on:
  schedule:
    # 00:17 UTC daily. The odd minute is intentional: GitHub-scheduled
    # workflows queue up at the top of the hour and can be delayed or
    # dropped under load. An off-peak minute is more reliable.
    - cron: "17 0 * * *"
  workflow_dispatch:

# Allow only one run at a time so concurrent triggers (cron + manual)
# don't race each other on push.
concurrency:
  group: daily-paint
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  paint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          # Full history isn't needed; a shallow clone is faster and
          # still lets us push because we use the default GITHUB_TOKEN.
          fetch-depth: 1
          ref: master

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Configure git identity
        env:
          # Define these in: Settings -> Secrets and variables ->
          # Actions -> Variables.
          # GIT_AUTHOR_EMAIL must be a verified email on your GitHub
          # account OR your <id>+<user>@users.noreply.github.com address,
          # otherwise the commit will not count toward your graph.
          GIT_AUTHOR_NAME: ${{ vars.GIT_AUTHOR_NAME }}
          GIT_AUTHOR_EMAIL: ${{ vars.GIT_AUTHOR_EMAIL }}
        run: |
          set -euo pipefail
          name="${GIT_AUTHOR_NAME:-github-actions[bot]}"
          email="${GIT_AUTHOR_EMAIL:-41898282+github-actions[bot]@users.noreply.github.com}"
          echo "Using git identity: $name <$email>"
          git config user.name  "$name"
          git config user.email "$email"

      - name: Run daily_paint.py
        run: python daily_paint.py

      - name: Push if there is a new commit
        run: |
          set -euo pipefail
          # If the local branch is ahead of origin, push. Otherwise the
          # script decided today's entry already existed, and there is
          # nothing to do.
          if [ "$(git rev-list --count @{u}..HEAD)" -gt 0 ]; then
            echo "Pushing new commit(s) to origin/master."
            git push origin HEAD:master
          else
            echo "No new commits to push."
          fi
